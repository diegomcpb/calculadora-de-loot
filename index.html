<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Calculadora pessoal de loot. Cadastre itens, informe quantidades e veja o total em GP.">

<title>Calculadora de Loot • Tibia Relic</title>

<link rel="icon" type="image/png" href="./tibia-relic-logo.png">

<style>
:root {
  color-scheme: dark;
  --bg: #111820;
  --panel: #1b2633;
  --line: #344457;
  --text: #edf2f7;
  --muted: #b0becf;
  --gold: #ecc46c;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, sans-serif;
}

main {
  max-width: 1280px;
  margin: auto;
  padding: 32px 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}

.heading {
  display: flex;
  align-items: center;
  gap: 24px;
}

.logo-link {
  display: block;
  flex-shrink: 0;
  border-radius: 8px;
}

.logo {
  display: block;
  width: 150px;
  height: auto;
}

.logo-link:hover {
  filter: brightness(1.1);
}

h1 {
  font-size: clamp(25px, 5vw, 36px);
  margin: 0;
}

h2 {
  margin: 0 0 18px;
  font-size: 24px;
}

p {
  color: var(--muted);
  margin: 8px 0 20px;
}

.total {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 24px;
  min-width: 240px;
}

.total small {
  display: block;
  color: var(--muted);
}

.total strong {
  font-size: 30px;
  color: var(--gold);
}

.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 24px 0 16px;
}

button {
  font: inherit;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  padding: 10px 16px;
  cursor: pointer;
}

.primary {
  background: var(--gold);
  color: #1b2028;
  border-color: var(--gold);
  font-weight: 700;
}

button:hover {
  filter: brightness(1.12);
}

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

input, select {
  font: inherit;
  color: var(--text);
  background: #111b27;
  border: 1px solid #60758c;
  border-radius: 6px;
  padding: 9px;
  max-width: 100%;
}

#search {
  width: 100%;
  margin-bottom: 16px;
}

.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
}

th, td {
  padding: 13px 16px;
  text-align: left;
  border-bottom: 1px solid var(--line);
}

th {
  background: #253448;
  font-size: 13px;
  color: #d7e1ee;
}

tbody tr:nth-child(even) {
  background: #17212d;
}

tbody tr:last-child td {
  border-bottom: 0;
}

.number {
  text-align: right;
}

td input {
  width: 110px;
  text-align: right;
}

td input:invalid {
  border-color: #ff8e8e;
}

td:first-child {
  font-weight: 600;
}

.personal {
  display: block;
  color: var(--gold);
  font-size: 11px;
  font-weight: 400;
}

.note {
  font-size: 13px;
  margin-top: 14px;
}

.status {
  min-height: 25px;
  color: var(--gold);
}

dialog {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  width: min(94vw, 480px);
  max-height: 90vh;
}

dialog::backdrop {
  background: #000b;
}

label {
  display: block;
  margin-top: 14px;
}

label input, label select {
  display: block;
  width: 100%;
  margin-top: 5px;
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}

#form-error {
  color: #ffaaaa;
}

footer {
  color: var(--muted);
  font-size: 13px;
  margin-top: 24px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

@media (max-width: 600px) {
  main {
    padding: 24px 12px;
  }

  .heading {
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }

  .logo {
    width: 120px;
  }

  .total {
    width: 100%;
  }

  th, td {
    padding: 10px;
  }
}
</style>
</head>

<body>
<main>

  <header>
    <div class="heading">

      <a
        class="logo-link"
        href="https://www.tibiarelic.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir o site oficial do Tibia Relic em outra aba"
      >
        <img
          class="logo"
          src="./tibia-relic-logo.png"
          alt="Tibia Relic"
          width="521"
          height="481"
        >
      </a>

      <div>
        <h1>Calculadora de Loot</h1>
        <p>Seus itens, suas quantidades e seu total em GP.</p>
      </div>

    </div>

    <div class="total">
      <small>Valor total do loot</small>
      <strong id="grand-total">0 GP</strong>
    </div>
  </header>

  <div class="tools">
    <button id="add" class="primary">+ Incluir item</button>
    <button id="export">Exportar backup</button>
    <button id="import">Importar backup</button>

    <input
      type="file"
      id="backup-file"
      accept=".json,application/json"
      hidden
    >
  </div>

  <label class="sr-only" for="search">
    Buscar item ou cidade
  </label>

  <input
    id="search"
    type="search"
    placeholder="Buscar item ou cidade…"
  >

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">Item</th>
          <th scope="col"
